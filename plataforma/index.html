<meta charset="utf-8">
<title>Involutivo de Glebas</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
/* ============================================================================
   Tema escuro é o padrão da plataforma. O claro fica disponível no botão do
   topo e se aplica por [data-tema="claro"] na raiz.
   Três medidas governam todo o alinhamento: --rot, --campo e --gap.
   ========================================================================== */
:root{
  --ground:#0D1013; --surface:#14181D; --elev:#1A1F26; --rule:#252C34; --rule-soft:#1B2128;
  --ink:#E8EAEC; --ink2:#AEB6BF; --muted:#79838D;
  --acento:#C2A878; --acento-forte:#D8BF92; --acento-fraco:#3A3122;
  --link:#8FB3D9;
  --barra-bg:#090C0F; --barra-ink:#ECEEF0; --barra-sub:#8A949E;
  --cab-bg:#1A1F26; --cab-ink:#C2A878; --cab-sub:#79838D;
  --campo-bg:#1A2027; --campo-borda:#303945; --campo-foco:#C2A878;
  --pos:#6FB08C; --neg:#D98A63; --warn:#C2A878; --aviso-bg:#20191055;
  --sombra:0 1px 2px rgba(0,0,0,.35);
  --rot:296px; --campo:132px; --comp:152px; --uni:32px; --gap:24px; --dentro:8px;
  /* uma altura de linha e seis tamanhos de letra governam a plataforma
     inteira — só o fluxo de caixa, por ser denso, tem escala própria */
  --linha:34px; --alt:28px; --lh:1.45; --sufixo:21px; --prefixo:25px;
  --t-tit:12.5px; --t-rot:12.5px; --t-val:12.5px;
  --t-uni:11.5px; --t-nota:11.5px; --t-cab:10.5px;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
:root[data-tema="claro"]{
  --ground:#EDF1F5; --surface:#FFFFFF; --elev:#1F4E78; --rule:#D8E0E8; --rule-soft:#EBEFF4;
  --ink:#14202E; --ink2:#3C4B5C; --muted:#6A7A8B;
  --acento:#1F4E78; --acento-forte:#17395A; --acento-fraco:#E8EFF6;
  --link:#1F4E78;
  --barra-bg:#1F4E78; --barra-ink:#FFFFFF; --barra-sub:#BCD5EA;
  --cab-bg:#1F4E78; --cab-ink:#FFFFFF; --cab-sub:#BCD5EA;
  --campo-bg:#E7F0FA; --campo-borda:#A9C8E6; --campo-foco:#1F4E78;
  --pos:#1B6E52; --neg:#B4512A; --warn:#8A6410; --aviso-bg:#FDF6E7;
  --sombra:0 1px 2px rgba(20,32,46,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:var(--t-rot);line-height:var(--lh)}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;color:inherit}

/* ---------- barra superior ---------- */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--barra-bg);
  color:var(--barra-ink);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule)}
.barra .vazio{flex:1}
.resumo-topo{display:flex;gap:22px;align-items:baseline}
.resumo-topo div{display:flex;flex-direction:column}
.resumo-topo .r{font-size:var(--t-cab);letter-spacing:.11em;color:var(--barra-sub);text-transform:uppercase}
.resumo-topo .v{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--barra-ink)}
.acao{background:transparent;border:1px solid var(--rule);border-radius:5px;padding:6px 11px;
  font-size:var(--t-nota);cursor:pointer;color:var(--barra-ink);height:var(--alt)}
:root[data-tema="claro"] .acao{border-color:rgba(255,255,255,.3)}
.acao:hover{border-color:var(--acento);color:var(--acento)}
:root[data-tema="claro"] .acao:hover{background:rgba(255,255,255,.16);color:#fff;border-color:#fff}
.acao.destaque{background:var(--acento);border-color:var(--acento);color:#12161A;font-weight:500}
.acao.destaque:hover{background:var(--acento-forte);border-color:var(--acento-forte);color:#12161A}
:root[data-tema="claro"] .acao.destaque{background:#fff;color:var(--acento)}

/* ---------- abas ---------- */
.abas{position:sticky;top:calc(env(safe-area-inset-top,0px) + 45px);z-index:29;background:var(--surface);
  border-bottom:1px solid var(--rule);display:flex;overflow-x:auto;overflow-y:hidden;padding:0 12px 1px;
  scrollbar-width:none;-ms-overflow-style:none}
.abas::-webkit-scrollbar{display:none}
.aba{border:none;background:none;padding:10px 15px;font-size:var(--t-rot);color:var(--muted);cursor:pointer;
  white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.aba:hover{color:var(--ink)}
.aba[aria-selected="true"]{color:var(--acento);border-bottom-color:var(--acento);font-weight:600}
.aba:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}

/* ---------- folha ---------- */
.folha{padding:18px 20px 60px;max-width:1680px;margin:0 auto}
.folha-topo{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.folha-topo:empty{display:none}
.selo{font-size:var(--t-cab);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;
  background:var(--acento-fraco);color:var(--acento)}
.selo.off{background:var(--rule-soft);color:var(--muted)}

.quadro{background:var(--surface);border:1px solid var(--rule);border-radius:4px;margin-bottom:14px;
  box-shadow:var(--sombra);overflow:hidden}
details.quadro>summary{background:var(--cab-bg);padding:8px 14px;display:flex;align-items:center;gap:10px;
  cursor:pointer;list-style:none;border-bottom:1px solid var(--rule)}
details.quadro>summary::-webkit-details-marker{display:none}
details.quadro>summary h2{font-family:var(--cond);font-size:var(--t-tit);letter-spacing:.09em;
  text-transform:uppercase;color:var(--cab-ink)}
details.quadro>summary .obs{font-size:var(--t-nota);color:var(--cab-sub);font-weight:400}
details.quadro>summary .seta{margin-left:auto;width:8px;height:8px;border-right:1.6px solid var(--cab-sub);
  border-bottom:1.6px solid var(--cab-sub);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.quadro[open]>summary .seta{transform:rotate(45deg)}
details.quadro>summary:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.quadro .interior{padding:2px 14px 10px}

/* ---------- registro: rótulo | campo | unidade | complemento | nota ---------- */
.reg{display:grid;grid-template-columns:var(--rot) var(--campo) var(--uni) var(--comp) minmax(0,1fr);
  gap:0 var(--gap);align-items:center;min-height:var(--linha);padding:3px 0;
  border-bottom:1px solid var(--rule-soft)}
.reg:last-child{border-bottom:none}
.reg>.rot{font-size:var(--t-rot);color:var(--ink2);line-height:var(--lh)}
.reg>.val{display:flex;justify-content:flex-end;align-items:center}
.reg>.val>*{width:100%}
.reg>.uni{font-size:var(--t-uni);color:var(--muted);white-space:nowrap}
.reg>.comp{font-size:var(--t-val);color:var(--muted);font-family:var(--mono);text-align:left;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.reg>.nota{font-size:var(--t-nota);color:var(--muted);line-height:var(--lh)}
.reg>.livre{grid-column:2/5;display:flex;justify-content:flex-end;align-items:center;gap:7px}
.reg>.livre>*{width:auto}
@media (max-width:1560px){
  :root{--rot:264px;--comp:140px;--gap:18px}
}
@media (max-width:1100px){
  :root{--rot:200px;--campo:118px;--comp:118px;--gap:12px}
  .reg{grid-template-columns:minmax(0,1fr) var(--campo) 30px;gap:0 8px}
  .reg>.comp{grid-column:2/4}
  .reg>.nota{grid-column:1/-1;padding-bottom:4px}
  .reg>.livre{grid-column:1/-1;justify-content:flex-start}
}

/* ---------- campos e valores: mesmo tamanho, mesmo recuo interno ---------- */
input,select{font:inherit;font-family:var(--mono);font-size:var(--t-val);background:var(--campo-bg);
  border:1px solid var(--campo-borda);border-radius:3px;padding:4px var(--dentro);text-align:right;
  color:var(--ink);width:var(--campo);max-width:100%;min-width:0;height:var(--alt);line-height:1.2}
/* todo campo numérico guarda a mesma folga à direita; % e m² a ocupam, de
   modo que os dígitos caem sempre na mesma coluna. R$ vai do lado esquerdo,
   onde não disputa espaço com o número. */
input.num{padding-right:calc(var(--dentro) + var(--sufixo))}
input.num.com-prefixo{padding-left:calc(var(--dentro) + var(--prefixo))}
.campo{position:relative;display:inline-block;width:var(--campo);max-width:100%;vertical-align:middle}
.campo>input{width:100%}
.campo>.sufixo,.campo>.prefixo{position:absolute;top:0;height:var(--alt);display:flex;
  align-items:center;font-family:var(--mono);font-size:var(--t-val);color:var(--muted);
  pointer-events:none}
.campo>.sufixo{right:var(--dentro)}
.campo>.prefixo{left:var(--dentro)}
.campo>input:disabled~.sufixo,.campo>input:disabled~.prefixo{opacity:.7}
.campo.sem-afixo>.sufixo,.campo.sem-afixo>.prefixo{display:none}
select{font-family:var(--sans);text-align:left}
input[type=text]{font-family:var(--sans);text-align:left}
input.num{font-family:var(--mono);text-align:right}
input.limitado{border-color:var(--warn);background:var(--aviso-bg)}
.reg>.val>input,.reg>.val>select,.reg>.val>.campo{width:100%}
input:focus,select:focus{outline:2px solid var(--campo-foco);outline-offset:-1px}
input:disabled{background:transparent;border-color:var(--rule-soft);color:var(--muted);
  opacity:.7;cursor:default}
/* número sugerido: está lá e entra na conta, mas ainda é sugestão da
   plataforma, não dado do avaliador — por isso a letra mais clara */
input.sugerido{color:var(--muted)}
.un{font-size:var(--t-uni);color:var(--muted);white-space:nowrap}
/* o recuo faz os dígitos calculados caírem na mesma coluna dos digitados */
.calc{font-family:var(--mono);font-size:var(--t-val);text-align:right;color:var(--ink);
  padding-right:calc(var(--dentro) + var(--sufixo) + 1px);font-variant-numeric:tabular-nums}
.reg>.val>.calc{display:block;width:100%}
.calc.txt{padding-right:var(--dentro)}
.calc.fraco{color:var(--muted)}

/* ---------- grades: herdam a mesma grade dos registros ---------- */
table.grade{width:100%;table-layout:fixed;border-collapse:collapse;font-size:var(--t-rot)}
table.grade th,table.grade td{width:calc(var(--campo) + var(--gap));padding:3px 0 3px var(--gap);
  height:var(--linha);text-align:right;vertical-align:middle}
table.grade th:first-child,table.grade td:first-child{width:var(--rot);padding-left:0;text-align:left}
table.grade th:last-child,table.grade td:last-child{width:auto;padding:0}
table.grade th{font-weight:500;font-size:var(--t-cab);letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);padding-right:calc(var(--dentro) + var(--sufixo) + 1px);
  border-bottom:1px solid var(--rule)}
table.grade th:first-child,table.grade th:last-child{padding-right:0}
table.grade td{border-bottom:1px solid var(--rule-soft)}
table.grade td:first-child{color:var(--ink2)}
table.grade td>input,table.grade td>select,table.grade td>.calc,table.grade td>.campo{
  width:var(--campo);display:inline-block;text-align:right;vertical-align:middle}
table.grade tr.forte td{border-top:1px solid var(--rule)}
.nota-linha{font-size:var(--t-nota);color:var(--muted);line-height:var(--lh)}
.nota-bloco{font-size:var(--t-nota);color:var(--muted);padding:8px 0 2px;line-height:var(--lh);max-width:172ch}

/* ---------- tabelas de saída ---------- */
.rolagem{overflow:auto;max-height:70vh;border:1px solid var(--rule);border-radius:4px;background:var(--surface)}
table.dados{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--t-rot)}
table.dados th{position:sticky;top:0;background:var(--surface);color:var(--muted);font-weight:500;
  text-align:right;padding:7px 9px;border-bottom:1px solid var(--rule);white-space:nowrap;z-index:2;
  font-size:var(--t-cab);letter-spacing:.05em;text-transform:uppercase}
table.dados th:first-child,table.dados td:first-child{text-align:left;position:sticky;left:0;
  background:var(--surface);z-index:1}
table.dados th:first-child{z-index:3}
table.dados td{text-align:right;padding:3px 9px;border-bottom:1px solid var(--rule-soft);
  font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.dados td:first-child{font-family:var(--sans);color:var(--ink2)}
table.dados tr.total td{border-bottom:1px solid var(--rule);border-top:1px solid var(--rule)}
table.dados.compacto{font-size:9.5px}
table.dados.compacto th{font-size:9px;padding:6px 11px;letter-spacing:.02em;white-space:normal;
  text-transform:none;line-height:1.3;vertical-align:bottom;width:84px;min-width:72px}
table.dados.compacto th:first-child{width:48px;min-width:48px;padding-left:12px}
table.dados.compacto td{padding:2px 11px;line-height:1.6}
table.dados.compacto td:first-child{padding-left:12px}
table.dados tr:hover td{background:var(--rule-soft)}
.neg{color:var(--neg)}
tr.soma td{border-top:1px solid var(--rule)}
tr.soma td:first-child{color:var(--ink2)}
td.ind{padding-left:24px}

/* ---------- indicadores ---------- */
.painel{display:flex;flex-wrap:wrap;gap:1px;background:var(--rule);border:1px solid var(--rule);
  border-radius:4px;overflow:hidden}
.painel .cel{background:var(--surface);padding:11px 13px;flex:1 1 180px;min-width:168px}
.painel .k{font-size:var(--t-cab);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.painel .v{font-family:var(--mono);font-size:19px;font-weight:500;margin-top:3px;font-variant-numeric:tabular-nums}
.painel .n{font-size:var(--t-nota);color:var(--muted);margin-top:1px}
.destaque-gleba{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--acento);
  border-radius:4px;padding:16px 18px;margin-bottom:14px;display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
.destaque-gleba .k{font-size:var(--t-cab);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.destaque-gleba .v{font-family:var(--mono);font-size:38px;font-weight:500;line-height:1.05;
  letter-spacing:-.01em;color:var(--acento)}
.destaque-gleba .n{font-size:var(--t-nota);color:var(--muted);margin-top:3px;max-width:64ch}
.acao-clara{background:var(--acento-fraco);border:1px solid var(--campo-borda);border-radius:4px;
  padding:7px 13px;font-size:var(--t-rot);color:var(--acento);cursor:pointer}
.acao-clara:hover{border-color:var(--acento)}
.acao-clara:disabled{opacity:.6;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-nota);color:var(--ink2);
  border:1px solid var(--rule);border-radius:3px;padding:4px 9px;background:var(--surface)}
.chip .pt{width:6px;height:6px;border-radius:50%;background:var(--pos)}
.chip.ruim{border-color:var(--neg);color:var(--neg)}
.chip.ruim .pt{background:var(--neg)}
.alerta{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--warn);
  border-radius:4px;padding:10px 14px;font-size:var(--t-rot);line-height:var(--lh);margin-bottom:14px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.alerta>span{flex:1 1 380px}
.alerta.ruim{border-left-color:var(--neg)}
.alerta.oculto{display:none}
.aviso-flutuante{position:fixed;right:18px;bottom:18px;z-index:60;max-width:380px;background:var(--surface);
  border:1px solid var(--warn);border-left:3px solid var(--warn);border-radius:4px;padding:11px 14px;
  font-size:var(--t-rot);line-height:var(--lh);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.aviso-flutuante b{display:block;font-size:var(--t-cab);letter-spacing:.08em;text-transform:uppercase;
  color:var(--warn);margin-bottom:3px}
.memo h3{font-family:var(--cond);font-size:var(--t-tit);letter-spacing:.05em;text-transform:uppercase;
  color:var(--acento);margin:18px 0 6px}
.memo p{margin:0 0 9px;max-width:104ch;font-size:var(--t-rot);color:var(--ink2);line-height:1.65}
.memo .num{font-family:var(--mono);color:var(--ink);font-weight:500}
</style>

<header class="barra">
  <div class="resumo-topo" id="resumo-topo"></div>
  <span class="vazio"></span>
  <button class="acao" id="btn-tema" type="button" title="Alternar tema">Tema claro</button>
  <button class="acao" id="btn-restaurar" type="button">Restaurar padrão</button>
  <button class="acao" id="btn-json" type="button">Salvar</button>
  <button class="acao destaque" id="btn-csv" type="button">Exportar fluxo</button>
</header>
<nav class="abas" id="abas" role="tablist"></nav>
<main class="folha" id="folha"></main>

<script src="motor.js"></script>
<script src="app.js"></script>

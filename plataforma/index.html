<meta charset="utf-8">
<title>Involutivo de Glebas</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
:root{
  --ink:#14202E; --ink2:#3C4B5C; --muted:#6A7A8B;
  --navy:#1F4E78; --navy2:#17395A; --navy-soft:#E8EFF6;
  --ground:#EDF1F5; --surface:#FFFFFF; --rule:#D8E0E8; --rule-soft:#EBEFF4;
  --campo-bg:#E7F0FA; --campo-borda:#A9C8E6; --campo-foco:#1F4E78;
  --pos:#1B6E52; --neg:#B4512A; --warn:#8A6410;
  --sombra:0 1px 2px rgba(20,32,46,.05);
  --rot:296px;        /* coluna do rótulo, igual em quadros e tabelas */
  --campo:132px;      /* largura de todo campo digitável e de todo valor calculado */
  --gap:12px;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#E7EDF4; --ink2:#B7C4D2; --muted:#8497A8;
  --navy:#7FB2DE; --navy2:#A8CCEA; --navy-soft:#1A2938;
  --ground:#0E1620; --surface:#16212E; --rule:#27333F; --rule-soft:#1E2A37;
  --campo-bg:#1A2C3E; --campo-borda:#33506E; --campo-foco:#7FB2DE;
  --pos:#57B08C; --neg:#E08A5F; --warn:#C9A44B;
  --sombra:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ink:#E7EDF4; --ink2:#B7C4D2; --muted:#8497A8;
  --navy:#7FB2DE; --navy2:#A8CCEA; --navy-soft:#1A2938;
  --ground:#0E1620; --surface:#16212E; --rule:#27333F; --rule-soft:#1E2A37;
  --campo-bg:#1A2C3E; --campo-borda:#33506E; --campo-foco:#7FB2DE;
  --pos:#57B08C; --neg:#E08A5F; --warn:#C9A44B;
  --sombra:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;color:inherit}

/* ---------- barra superior ---------- */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:#fff;
  display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.barra .nome{font-family:var(--cond);font-size:19px;letter-spacing:.005em}
.barra .sub{font-size:12px;color:#BCD5EA}
.barra .vazio{flex:1}
.resumo-topo{display:flex;gap:20px;align-items:baseline}
.resumo-topo div{display:flex;flex-direction:column}
.resumo-topo .r{font-size:9.5px;letter-spacing:.11em;color:#9FC2DE;text-transform:uppercase}
.resumo-topo .v{font-family:var(--mono);font-size:15px;font-weight:500}
.acao{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:6px;
  padding:6px 11px;font-size:12px;cursor:pointer;color:#fff}
.acao:hover{background:rgba(255,255,255,.2)}
.acao.destaque{background:#fff;color:var(--navy);border-color:#fff;font-weight:500}

/* ---------- abas = planilhas ---------- */
.abas{position:sticky;top:calc(env(safe-area-inset-top,0px) + 45px);z-index:29;background:var(--surface);
  border-bottom:1px solid var(--rule);display:flex;gap:0;overflow-x:auto;padding:0 12px}
.aba{border:none;background:none;padding:10px 15px;font-size:13px;color:var(--muted);cursor:pointer;
  white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.aba:hover{color:var(--ink)}
.aba[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.aba:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}

/* ---------- folha ---------- */
.folha{padding:18px 20px 60px;max-width:1520px;margin:0 auto}
.folha-topo{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.folha-topo h1{font-family:var(--cond);font-size:22px}
.folha-topo p{margin:0;font-size:12.5px;color:var(--muted);max-width:74ch}
.selo{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;
  background:var(--navy-soft);color:var(--navy)}
.selo.off{background:var(--rule-soft);color:var(--muted)}

.quadro{background:var(--surface);border:1px solid var(--rule);border-radius:4px;margin-bottom:14px;
  box-shadow:var(--sombra);overflow:hidden}
details.quadro>summary{background:var(--navy);color:#fff;padding:7px 14px;display:flex;align-items:center;
  gap:10px;cursor:pointer;list-style:none}
details.quadro>summary::-webkit-details-marker{display:none}
details.quadro>summary h2{font-family:var(--cond);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
details.quadro>summary .obs{font-size:11.5px;color:#BCD5EA;font-weight:400}
details.quadro>summary .seta{margin-left:auto;width:8px;height:8px;border-right:1.6px solid #BCD5EA;
  border-bottom:1.6px solid #BCD5EA;transform:rotate(-45deg);transition:transform .15s;flex:none}
details.quadro[open]>summary .seta{transform:rotate(45deg)}
details.quadro>summary:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.quadro .interior{padding:2px 14px 10px}

.reg{display:grid;
  grid-template-columns:var(--rot) var(--campo) 30px minmax(110px,.8fr) minmax(0,1.8fr);
  gap:0 var(--gap);align-items:center;padding:5px 0;border-bottom:1px solid var(--rule-soft)}
.reg:last-child{border-bottom:none}
.reg>.rot{font-size:12.5px;color:var(--ink2)}
.reg>.val{display:flex;justify-content:flex-end;align-items:center}
.reg>.val>*{width:100%}
.reg>.uni{font-size:11px;color:var(--muted)}
.reg>.comp{font-size:12px;color:var(--muted);font-family:var(--mono);text-align:right;
  font-variant-numeric:tabular-nums}
.reg>.nota{font-size:11.5px;color:var(--muted);line-height:1.35}
.reg>.livre{grid-column:2/5;display:flex;justify-content:flex-end;align-items:center;gap:7px}
.reg>.livre>*{width:auto}
.reg>.livre input,.reg>.livre select{width:88px}
.reg>.livre .calc{min-width:64px}
.aviso-flutuante{position:fixed;right:18px;bottom:18px;z-index:60;max-width:380px;background:var(--surface);
  border:1px solid var(--warn);border-left:3px solid var(--warn);border-radius:4px;padding:11px 14px;
  font-size:12.5px;color:var(--ink);box-shadow:0 6px 20px rgba(20,32,46,.14)}
.aviso-flutuante b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--warn);margin-bottom:3px}
.reg.forte{background:var(--rule-soft);margin:0 -14px;padding-left:14px;padding-right:14px}
.reg.forte>.rot{font-weight:600;color:var(--ink)}
.reg.forte>.val,.reg.forte>.comp{font-weight:600;color:var(--ink)}
@media (max-width:1100px){
  :root{--rot:200px;--campo:118px}
  .reg{grid-template-columns:minmax(0,1fr) var(--campo) 30px;gap:0 8px}
  .reg>.comp{grid-column:2/4;text-align:right}
  .reg>.nota{grid-column:1/-1;padding-bottom:4px}
  .reg>.livre{grid-column:1/-1;justify-content:flex-start}
}

input,select{font:inherit;font-family:var(--mono);font-size:12.5px;background:var(--campo-bg);
  border:1px solid var(--campo-borda);border-radius:3px;padding:4px 7px;text-align:right;color:var(--ink);
  width:var(--campo);max-width:100%;min-width:0;height:28px}
select{font-family:var(--sans);text-align:left}
input[type=text]{font-family:var(--sans);text-align:left}
input.limitado{border-color:var(--warn);background:#FDF6E7}
.reg>.val>input,.reg>.val>select{width:100%}
input:focus,select:focus{outline:2px solid var(--campo-foco);outline-offset:-1px;background:var(--surface)}
input:disabled{background:var(--rule-soft);border-color:var(--rule);color:var(--muted)}
.un{font-size:11px;color:var(--muted);min-width:26px}
.calc{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--ink);
  font-variant-numeric:tabular-nums}
.reg>.val>.calc,.reg>.comp>.calc{display:block;width:100%}
.calc.fraco{color:var(--muted)}

table.grade{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px}
table.grade th,table.grade td{width:calc(var(--campo) + var(--gap));padding:3px 0 3px var(--gap);
  text-align:right;vertical-align:middle}
table.grade th:first-child,table.grade td:first-child{width:var(--rot);padding-left:0;text-align:left}
table.grade th:last-child,table.grade td:last-child{width:auto;padding:0}
table.grade th{font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);padding-top:6px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
table.grade td{border-bottom:1px solid var(--rule-soft)}
table.grade td:first-child{color:var(--ink2)}
table.grade td>input,table.grade td>select,table.grade td>.calc{width:var(--campo);display:inline-block;
  text-align:right;vertical-align:middle}
table.grade tr.forte td{background:var(--rule-soft);font-weight:600;color:var(--ink)}
.nota-bloco{font-size:11.5px;color:var(--muted);padding:8px 0 2px;line-height:1.45;max-width:96ch}

/* ---------- tabelas de saída ---------- */
.rolagem{overflow:auto;max-height:70vh;border:1px solid var(--rule);border-radius:4px;background:var(--surface)}
table.dados{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.dados th{position:sticky;top:0;background:var(--surface);color:var(--muted);font-weight:500;
  text-align:right;padding:7px 9px;border-bottom:1px solid var(--rule);white-space:nowrap;z-index:2;
  font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
table.dados th:first-child,table.dados td:first-child{text-align:left;position:sticky;left:0;
  background:var(--surface);z-index:1}
table.dados th:first-child{z-index:3}
table.dados td{text-align:right;padding:3px 9px;border-bottom:1px solid var(--rule-soft);
  font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.dados td:first-child{font-family:var(--sans);color:var(--ink2)}
table.dados tr.total td{background:var(--navy-soft);font-weight:500;border-bottom:1px solid var(--rule)}
table.dados tr.total td:first-child{background:var(--navy-soft);font-weight:600}
table.dados.compacto{font-size:9.5px}
table.dados.compacto th{font-size:9px;padding:6px 11px;letter-spacing:.02em;white-space:normal;
  text-transform:none;line-height:1.3;vertical-align:bottom;width:84px;min-width:72px}
table.dados.compacto th:first-child{width:48px;min-width:48px;padding-left:12px}
table.dados.compacto td{padding:2px 11px;line-height:1.6}
table.dados.compacto td:first-child{padding-left:12px}
table.dados tr:hover td{background:var(--rule-soft)}
table.dados tr.total:hover td{background:var(--navy-soft)}
.neg{color:var(--neg)}
tr.soma td{background:var(--rule-soft);font-weight:600;border-top:1px solid var(--rule)}
tr.soma td:first-child{background:var(--rule-soft);color:var(--ink)}
td.ind{padding-left:24px}

/* ---------- indicadores ---------- */
.painel{display:flex;flex-wrap:wrap;gap:1px;background:var(--rule);border:1px solid var(--rule);
  border-radius:4px;overflow:hidden}
.painel .cel{background:var(--surface);padding:11px 13px;flex:1 1 180px;min-width:168px}
.painel .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.painel .v{font-family:var(--mono);font-size:19px;font-weight:500;margin-top:3px;font-variant-numeric:tabular-nums}
.painel .n{font-size:11.5px;color:var(--muted);margin-top:1px}
.destaque-gleba{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--navy);
  border-radius:4px;padding:16px 18px;margin-bottom:14px;display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
.destaque-gleba .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.destaque-gleba .v{font-family:var(--mono);font-size:38px;font-weight:500;line-height:1.05;letter-spacing:-.01em}
.destaque-gleba .n{font-size:12px;color:var(--muted);margin-top:3px;max-width:52ch}

.acao-clara{background:var(--navy-soft);border:1px solid var(--campo-borda);border-radius:4px;
  padding:7px 13px;font-size:12.5px;color:var(--navy);cursor:pointer}
.acao-clara:hover{background:var(--campo)}
.acao-clara:disabled{opacity:.6;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);
  border:1px solid var(--rule);border-radius:3px;padding:4px 9px;background:var(--surface)}
.chip .pt{width:6px;height:6px;border-radius:50%;background:var(--pos)}
.chip.ruim{border-color:var(--neg);color:var(--neg)}
.chip.ruim .pt{background:var(--neg)}
.alerta{border-left:3px solid var(--warn);background:var(--surface);border:1px solid var(--rule);
  border-left:3px solid var(--warn);border-radius:4px;padding:10px 14px;font-size:12.5px;margin-bottom:14px}
.memo h3{font-family:var(--cond);font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);
  margin:18px 0 6px}
.memo p{margin:0 0 9px;max-width:88ch;font-size:13px;color:var(--ink2);line-height:1.6}
.memo .num{font-family:var(--mono);color:var(--ink);font-weight:500}
</style>

<header class="barra">
  <span class="nome">Involutivo</span>
  <span class="sub" id="sub-estudo"></span>
  <span class="vazio"></span>
  <div class="resumo-topo" id="resumo-topo"></div>
  <button class="acao" id="btn-restaurar" type="button">Restaurar padrão</button>
  <button class="acao" id="btn-json" type="button">Salvar</button>
  <button class="acao destaque" id="btn-csv" type="button">Exportar fluxo</button>
</header>
<nav class="abas" id="abas" role="tablist"></nav>
<main class="folha" id="folha"></main>

<script src="motor.js"></script>
<script src="app.js"></script>

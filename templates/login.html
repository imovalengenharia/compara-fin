<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Entrar · Compara·Fin</title>
<style>
:root{--bg:#f5f5f2;--ink:#1a1a1a;--muted:#5a6170;--line:#e2ddd6;--brand:#0d3b66;--brand-2:#1e6091;--accent:#e85d04;--card:#fff;--bad:#b3261e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,var(--brand),var(--brand-2));min-height:100vh;display:flex;align-items:center;justify-content:center;font:15px/1.6 "Helvetica Neue",Arial,sans-serif}
.box{background:var(--card);border-radius:16px;padding:44px 40px;width:380px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.brand{font-weight:700;font-size:20px;color:var(--brand);text-align:center;margin-bottom:6px}
.brand span{color:var(--accent)}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:14px 0 6px}
input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:15px;font-family:inherit;outline:none;transition:.15s}
input:focus{border-color:var(--accent)}
button{width:100%;background:var(--brand);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:600;margin-top:24px;cursor:pointer;font-family:inherit;transition:.2s}
button:hover{filter:brightness(1.1)}
.erro{background:#fdeaea;color:var(--bad);font-size:13px;padding:10px 12px;border-radius:8px;margin-top:16px;text-align:center}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}
</style></head><body>
<div class="box">
  <div class="brand">Compara<span>·</span>Fin</div>
  <div class="sub">Análise Financeira Comparativa</div>
  <form method="post" action="/login">
    <label for="usuario">Usuário</label>
    <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus>
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>
  {{ERRO}}
  <div class="hint">Demo: anderson / compara2025</div>
</div>
</body></html>

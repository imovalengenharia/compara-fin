# Configuração de deploy no Render
services:
  - type: web
    name: compara-fin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true   # o Render gera uma chave fixa e segura automaticamente
